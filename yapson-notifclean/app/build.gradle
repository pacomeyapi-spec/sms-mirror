plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yapson.notifclean'
    compileSdk 34

    defaultConfig {
        applicationId "com.yapson.notifclean"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        yapson {
            storeFile file('yapson.keystore')
            storePassword 'yapson2026'
            keyAlias 'yapson'
            keyPassword 'yapson2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.yapson
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
