name: Build SMS Mirror APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build APK Android

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilation APK Debug
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Téléchargement APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: SmsMirror-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Préparer l'APK pour la Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SmsMirror.apk

      - name: Publier la Release (lien direct APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SMS Mirror — dernier APK
          body: "APK de debug signé avec la clé fixe Yapson. Téléchargement direct via le fichier SmsMirror.apk ci-dessous."
          files: SmsMirror.apk

      - name: Compilation APK Release (non signé)
        working-directory: android
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Téléchargement APK Release
        uses: actions/upload-artifact@v4
        with:
          name: SmsMirror-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
