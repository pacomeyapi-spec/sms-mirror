name: Build YapsonPress APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build APK YapsonPress

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3

      - name: Installation de Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilation APK Debug
        working-directory: yapsonpress-app
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Téléchargement APK Debug (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: YapsonPress-debug
          path: yapsonpress-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Préparer l'APK pour la Release
        run: cp yapsonpress-app/app/build/outputs/apk/debug/app-debug.apk YapsonPress.apk

      - name: Publier la Release (lien direct APK)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yapsonpress-latest
          name: YapsonPress — dernier APK
          body: "Application mobile YapsonPress (WebView, signée avec la clé fixe Yapson). Téléchargement direct via le fichier YapsonPress.apk ci-dessous."
          files: YapsonPress.apk
