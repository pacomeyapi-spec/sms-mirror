<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>YapsonPress</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg:#0f172a; --bg2:#111c34; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --brand:#2563eb; --brand2:#7c3aed; --ok:#16a34a; --danger:#dc2626;
    --chip:#f1f5f9; --chip-on:#2563eb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#f8fafc;color:var(--ink);
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  }
  .hidden{display:none!important}

  /* ── LOGIN ── */
  #login{
    min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:28px;background:radial-gradient(1200px 600px at 50% -10%,#1e3a8a 0%,var(--bg) 55%);
  }
  .logo{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;margin-bottom:18px;
    background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 12px 30px rgba(37,99,235,.45);
    font-size:38px}
  #login h1{color:#fff;margin:0 0 4px;font-size:24px;letter-spacing:.3px}
  #login p{color:#93a4c3;margin:0 0 26px;font-size:14px}
  .card-login{width:100%;max-width:400px;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.10);border-radius:20px;padding:22px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:#93a4c3;margin-bottom:6px;font-weight:600}
  .field input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.95);font-size:16px;color:#0f172a;outline:none}
  .field input:focus{border-color:var(--brand)}
  .btn{width:100%;padding:15px;border:0;border-radius:13px;font-size:16px;font-weight:700;cursor:pointer;
    color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 24px rgba(37,99,235,.4)}
  .btn:active{transform:translateY(1px)}
  .err{color:#fca5a5;font-size:13px;margin-top:12px;text-align:center;min-height:16px}

  /* ── APP ── */
  #app{min-height:100dvh;display:flex;flex-direction:column}
  header{
    position:sticky;top:0;z-index:20;color:#fff;
    background:linear-gradient(135deg,#1e3a8a,#4338ca);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(2,6,23,.25)}
  header .brand{font-weight:800;font-size:18px;letter-spacing:.3px;flex:1;display:flex;align-items:center;gap:9px}
  header .brand .dot{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:15px}
  header .acct{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:999px;
    letter-spacing:0;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  header .acct:empty{display:none}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;
    font-size:18px;cursor:pointer;display:grid;place-items:center}
  .iconbtn:active{background:rgba(255,255,255,.28)}

  .searchbar{padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .searchbar input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:#f8fafc;font-size:15px;outline:none}
  .searchbar input:focus{border-color:var(--brand);background:#fff}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:11px 12px;background:#fff;border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--chip);color:#334155;
    font-size:13px;font-weight:600;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
  .chip.on{background:var(--chip-on);color:#fff}
  .chip .badge{background:rgba(0,0,0,.12);border-radius:999px;padding:1px 7px;font-size:11px}
  .chip.on .badge{background:rgba(255,255,255,.25)}

  main{flex:1;padding:14px 12px 40px;max-width:820px;width:100%;margin:0 auto}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:11px;
    box-shadow:0 1px 2px rgba(2,6,23,.04)}
  .msg .top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .msg .snd{font-weight:700;font-size:13px;color:var(--brand);background:#eff6ff;padding:3px 9px;border-radius:8px}
  .msg .time{margin-left:auto;font-size:12px;color:var(--muted)}
  .msg .body{font-size:15px;line-height:1.5;color:#1e293b;white-space:pre-wrap;word-break:break-word}
  .msg .amount{font-weight:800;color:var(--ok)}
  .empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px}
  .loadmore{width:100%;padding:13px;border:1px dashed var(--line);border-radius:13px;background:#fff;
    color:var(--brand);font-weight:700;font-size:14px;cursor:pointer;margin-top:6px}

  /* ── Actions de statut (Approuvé / Pas de commande) ── */
  .msg.fresh{animation:pop .45s ease;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .msg.is-approuve{border-color:#bbf7d0;background:#f0fdf4}
  .msg.is-pas_de_commande{border-color:#fecaca;background:#fef2f2}
  .acts{display:flex;gap:8px;margin-top:11px}
  .act{flex:1;padding:10px 8px;border-radius:11px;border:1px solid var(--line);background:#fff;
    font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;
    align-items:center;justify-content:center;gap:6px;min-height:42px}
  .act:active{transform:translateY(1px)}
  .act.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .act.no.on{background:var(--danger);border-color:var(--danger);color:#fff}

  /* tablette : 2 colonnes de messages */
  @media(min-width:820px){
    main{padding:18px}
    #feed{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .msg{margin-bottom:0}
    .loadmore{grid-column:1 / -1}
  }
  /* grande tablette / paysage : 3 colonnes */
  @media(min-width:1200px){
    main{padding:22px}
    #feed{grid-template-columns:repeat(3,1fr);gap:14px}
    .wrap{max-width:1400px;margin:0 auto}
  }

  /* ── Sheet (token / menu) ── */
  .sheet-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:40;display:none;align-items:flex-end}
  .sheet-bg.show{display:flex}
  .sheet{width:100%;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);
    box-shadow:0 -10px 40px rgba(2,6,23,.3);animation:up .22s ease;
    max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .sheet h3{position:sticky;top:-20px;background:#fff;padding-top:2px;z-index:1}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h3{margin:2px 0 4px;font-size:18px}
  .sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .tokenbox{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;
    border:1px solid var(--line);border-radius:12px;padding:12px;background:#f8fafc;color:#0f172a;
    word-break:break-all;max-height:150px;overflow:auto;margin-bottom:14px}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  .btn.ghost{background:#f1f5f9;color:#334155;box-shadow:none}
  .btn.small{padding:13px}
  .menu-item{display:flex;align-items:center;gap:12px;padding:15px 8px;border-bottom:1px solid var(--line);
    font-size:16px;cursor:pointer;color:#1e293b}
  .menu-item.acct-row{padding:10px 8px;font-size:15px}
  .menu-item.acct-row .ic{width:30px;height:30px;border-radius:9px;font-size:15px}
  .menu-item.acct-row .rm{padding:6px 10px;color:var(--danger);font-size:15px;line-height:1}
  .menu-item:last-child{border-bottom:0}
  .menu-item .ic{width:38px;height:38px;border-radius:11px;background:#eff6ff;display:grid;place-items:center;font-size:18px}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger .ic{background:#fef2f2}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);
    background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;
    transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="logo">📡</div>
  <h1>YapsonPress</h1>
  <p>Console mobile</p>
  <div class="card-login">
    <div class="field">
      <label>Nom d'utilisateur</label>
      <input id="l-user" autocapitalize="none" autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn" onclick="doLogin()">Se connecter</button>
    <button class="btn ghost" id="l-back" style="display:none;margin-top:8px" onclick="cancelAddAccount()">Retour</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="brand"><span class="dot">📡</span> YapsonPress <span id="acct-badge" class="acct" onclick="openMenu()"></span></div>
    <button class="iconbtn" onclick="refresh()" title="Rafraîchir">⟳</button>
    <button class="iconbtn" onclick="openMenu()" title="Menu">☰</button>
  </header>
  <div class="searchbar"><input id="q" placeholder="🔍 Rechercher un message…" oninput="onSearch()"></div>
  <div class="chips" id="chips"></div>
  <main><div id="feed"></div></main>
</div>

<!-- SHEET -->
<div class="sheet-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = ''; // même origine que la page (servie par le serveur YapsonPress)
let token = localStorage.getItem('yp_token') || '';
let role  = localStorage.getItem('yp_role')  || '';
let uname = localStorage.getItem('yp_user')  || '';

/* ── Comptes multiples ──────────────────────────────────────────────────────
   Plusieurs comptes YapsonPress peuvent être enregistrés et basculés sans
   se reconnecter. Chaque compte garde son propre jeton (et donc ses propres
   expéditeurs et appareils autorisés). */
function loadAccounts(){
  try{ const a = JSON.parse(localStorage.getItem('yp_accounts')||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function saveAccounts(list){ localStorage.setItem('yp_accounts', JSON.stringify(list)); }
/* Reprise de l'ancien format (un seul compte) → aucune reconnexion nécessaire */
(function migrateAccounts(){
  const list = loadAccounts();
  if(!list.length && token && uname){ saveAccounts([{u:uname, r:role, t:token}]); }
})();
function upsertAccount(u, r, t){
  const list = loadAccounts();
  const i = list.findIndex(a=>a.u===u);
  if(i>=0) list[i] = {u, r, t}; else list.push({u, r, t});
  saveAccounts(list);
}
function setActiveAccount(acc){
  token = acc.t; role = acc.r; uname = acc.u;
  localStorage.setItem('yp_token',token);
  localStorage.setItem('yp_role',role);
  localStorage.setItem('yp_user',uname);
}
let currentSender = null;   // null = tous
let offset = 0, PAGE = 60, loading = false, searchTimer = null;
let socket = null, allSenders = [];

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1900); }

async function api(path, opts={}){
  const r = await fetch(API+path, {
    ...opts,
    headers:{ 'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{}) , ...(opts.headers||{}) }
  });
  if(r.status===401){ logout(); throw new Error('Session expirée'); }
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.error)||('Erreur '+r.status));
  return data;
}

async function doLogin(){
  const username = document.getElementById('l-user').value.trim() || 'admin';
  const password = document.getElementById('l-pass').value;
  const err = document.getElementById('l-err'); err.textContent='';
  if(!password){ err.textContent='Entre ton mot de passe'; return; }
  try{
    const r = await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error||'Identifiants incorrects');
    upsertAccount(d.username, d.role, d.token);
    setActiveAccount({u:d.username, r:d.role, t:d.token});
    document.getElementById('l-pass').value = '';
    document.getElementById('l-user').value = '';
    showApp();
  }catch(e){ err.textContent = e.message; }
}

/* Bascule vers un autre compte enregistré — aucune ressaisie de mot de passe */
function switchAccount(i){
  const acc = loadAccounts()[i];
  if(!acc) return;
  if(acc.u === uname){ closeSheet(); return; }
  try{ if(socket){ socket.disconnect(); socket=null; } }catch(e){}
  setActiveAccount(acc);
  currentSender = null; allSenders = []; offset = 0;
  const q = document.getElementById('q'); if(q) q.value = '';
  closeSheet();
  showApp();
  toast('Compte : '+acc.u);
}

/* Ajouter un compte : on affiche l'écran de connexion sans toucher aux comptes existants */
function addAccount(){
  closeSheet();
  try{ if(socket){ socket.disconnect(); socket=null; } }catch(e){}
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('l-err').textContent = '';
  updateLoginBack();
}

function removeAccount(i){
  const list = loadAccounts();
  const acc = list[i];
  if(!acc) return;
  if(!confirm('Retirer le compte « '+acc.u+' » de cette application ?')) return;
  const rest = list.filter((_,j)=>j!==i);
  saveAccounts(rest);
  if(acc.u === uname){
    if(rest.length){ switchAccount(0); }
    else{ logout(); }
  } else { openMenu(); toast('Compte retiré'); }
}

/* Revenir à l'application depuis l'écran « ajouter un compte » */
function cancelAddAccount(){
  if(!token) return;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  connectSocket();
}
function updateLoginBack(){
  const b = document.getElementById('l-back');
  if(b) b.style.display = (token && loadAccounts().length) ? '' : 'none';
}

function logout(){
  try{ if(socket){ socket.disconnect(); socket=null; } }catch(e){}
  const rest = loadAccounts().filter(a=>a.u!==uname);
  saveAccounts(rest);
  token=''; localStorage.removeItem('yp_token'); localStorage.removeItem('yp_role'); localStorage.removeItem('yp_user');
  closeSheet();
  if(rest.length){                       // il reste des comptes → on bascule au lieu de tout perdre
    setActiveAccount(rest[0]);
    currentSender = null; allSenders = []; offset = 0;
    showApp();
    toast('Compte : '+rest[0].u);
    return;
  }
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  updateLoginBack();
}

function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const b = document.getElementById('acct-badge');
  if(b) b.textContent = loadAccounts().length > 1 ? uname : '';
  loadSenders();
  reload();
  connectSocket();
}

function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(Number(ts)), now=new Date();
  const p=n=>String(n).padStart(2,'0');
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return p(d.getHours())+':'+p(d.getMinutes());
  return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function highlight(s){
  return esc(s).replace(/(\d[\d\s.,\u00a0]*\s*F(?:\s?CFA)?)/gi,'<span class="amount">$1</span>');
}

async function loadSenders(){
  try{
    const rows = await api('/api/senders');
    allSenders = rows;
    const chips = document.getElementById('chips');
    let html = `<div class="chip ${currentSender===null?'on':''}" onclick="pickSender(null)">Tous</div>`;
    html += rows.map(r=>{
      const name=r.display_name;
      const unread = r.unread>0?`<span class="badge">${r.unread}</span>`:'';
      return `<div class="chip ${currentSender===name?'on':''}" onclick="pickSender(${JSON.stringify(name).replace(/"/g,'&quot;')})">${esc(name)}${unread}</div>`;
    }).join('');
    chips.innerHTML = html;
  }catch(e){ /* silencieux */ }
}
function pickSender(name){ currentSender=name; loadSenders(); reload(); }

function onSearch(){ clearTimeout(searchTimer); searchTimer=setTimeout(reload,350); }

async function reload(){
  offset=0;
  document.getElementById('feed').innerHTML='<div class="empty">Chargement…</div>';
  await loadMessages(true);
}
async function refresh(){ await loadSenders(); await reload(); toast('Actualisé'); }

async function loadMessages(reset){
  if(loading) return; loading=true;
  const q = document.getElementById('q').value.trim();
  const params = new URLSearchParams({ limit:PAGE, offset });
  if(currentSender) params.set('sender', currentSender);
  if(q) params.set('search', q);
  try{
    const rows = await api('/api/messages?'+params.toString());
    const feed = document.getElementById('feed');
    if(reset) feed.innerHTML='';
    document.querySelector('.loadmore')?.remove();
    if(reset && !rows.length){ feed.innerHTML='<div class="empty">Aucun message</div>'; loading=false; return; }
    const frag = rows.map(m=>msgCard(m)).join('');
    feed.insertAdjacentHTML('beforeend', frag);
    offset += rows.length;
    if(rows.length===PAGE){
      const b=document.createElement('button'); b.className='loadmore'; b.textContent='Charger plus';
      b.onclick=()=>{ b.remove(); loadMessages(false); };
      feed.parentElement.appendChild(b);
    }
  }catch(e){ toast(e.message); }
  loading=false;
}

/* Le recalcul des expéditeurs (GROUP BY sur toute la table) est coûteux :
   on le limite à une fois toutes les 25 s max, même en cas de rafale de messages. */
let sendersTimer = null, sendersLast = 0;
const SENDERS_MIN_MS = 25000;
function refreshSendersThrottled(){
  const now = Date.now(), waited = now - sendersLast;
  if(waited >= SENDERS_MIN_MS){ sendersLast = now; loadSenders(); return; }
  if(!sendersTimer){
    sendersTimer = setTimeout(()=>{ sendersTimer=null; sendersLast=Date.now(); loadSenders(); }, SENDERS_MIN_MS - waited);
  }
}

/* ── Temps réel (socket.io) ── */
function connectSocket(){
  if(!token || typeof io === 'undefined') return;
  try{ if(socket) socket.disconnect(); }catch(e){}
  socket = io({ auth: { token }, transports:['websocket','polling'] });

  socket.on('new_messages', (msgs)=>{
    if(!msgs || !msgs.length) return;
    // Le serveur filtre déjà par appareil autorisé ; on filtre aussi par expéditeur visible
    const allowed = new Set(allSenders.map(s=>s.display_name));
    const visible = (role==='admin') ? msgs : msgs.filter(m=>allowed.has(m.sender_name||m.sender||m.app_name||'Inconnu'));
    if(!visible.length) return;

    // Ne garder que ceux qui correspondent au filtre et à la recherche en cours
    const q = (document.getElementById('q').value||'').trim().toLowerCase();
    const match = visible.filter(m=>{
      const snd = m.sender_name||m.sender||m.app_name||'Inconnu';
      if(currentSender && snd !== currentSender) return false;
      if(q && !((m.content||'').toLowerCase().includes(q) || snd.toLowerCase().includes(q))) return false;
      return true;
    });

    const feed = document.getElementById('feed');
    if(match.length){
      // Les plus récents en premier, insérés en haut du fil
      const html = match.slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(m=>msgCard(m)).join('');
      const vide = feed.querySelector('.empty');
      if(vide) feed.innerHTML = '';
      feed.insertAdjacentHTML('afterbegin', html);
      offset += match.length;                     // garde « Charger plus » cohérent
      match.forEach(m=>{
        const c = document.getElementById('m-'+String(m.id));
        if(c){ c.classList.add('fresh'); setTimeout(()=>c.classList.remove('fresh'), 2200); }
      });
    }
    // Rafraîchir les compteurs des pastilles + prévenir si le message n'est pas dans la vue
    refreshSendersThrottled();
    const first = visible[0];
    const snd = first.sender_name||first.sender||first.app_name||'Inconnu';
    if(!match.length) toast(visible.length===1 ? `Nouveau message — ${snd}` : `${visible.length} nouveaux messages`);
    vibrate();
  });

  socket.on('message_status_updated', ({id, status})=>{
    const card = document.getElementById('m-'+String(id));
    if(!card) return;
    card.classList.remove('is-approuve','is-pas_de_commande');
    if(status) card.classList.add('is-'+status);
    const acts = card.querySelectorAll('.act');
    acts.forEach(a=>a.classList.remove('on'));
    if(status==='approuve') card.querySelector('.act.ok')?.classList.add('on');
    if(status==='pas_de_commande') card.querySelector('.act.no')?.classList.add('on');
  });

  // Après une coupure réseau, on resynchronise le fil
  socket.on('connect', ()=>{ if(socket._wasOff){ socket._wasOff=false; loadSenders(); reload(); } });
  socket.on('disconnect', ()=>{ socket._wasOff = true; });
}
function vibrate(){ try{ if(navigator.vibrate) navigator.vibrate(35); }catch(e){} }

/* ── Carte message + statut (Approuvé / Pas de commande) ── */
function msgCard(m){
  const snd = m.sender_name||m.sender||m.app_name||'Inconnu';
  const st  = m.status||'';
  const id  = String(m.id).replace(/"/g,'&quot;');
  return `<div class="msg ${st?'is-'+st:''}" id="m-${esc(id)}">
    <div class="top"><span class="snd">${esc(snd)}</span><span class="time">${fmtTime(m.timestamp)}</span></div>
    <div class="body">${highlight(m.content||'')}</div>
    <div class="acts">
      <button class="act ok ${st==='approuve'?'on':''}" onclick="setStatus('${esc(id)}','approuve',this)">✔ Approuvé</button>
      <button class="act no ${st==='pas_de_commande'?'on':''}" onclick="setStatus('${esc(id)}','pas_de_commande',this)">✖ Pas de commande</button>
    </div>
  </div>`;
}

async function setStatus(id, status, btn){
  const card = document.getElementById('m-'+id);
  const acts = card ? card.querySelectorAll('.act') : [];
  // Si on reclique le statut déjà actif → on l'annule (comme sur le site)
  const already = btn.classList.contains('on');
  const target  = already ? null : status;
  // Affichage optimiste (réactif même en réseau lent)
  acts.forEach(a=>a.classList.remove('on'));
  if(target) btn.classList.add('on');
  if(card){
    card.classList.remove('is-approuve','is-pas_de_commande');
    if(target) card.classList.add('is-'+target);
  }
  try{
    await api('/api/messages/'+encodeURIComponent(id)+'/status', {
      method:'PATCH', body: JSON.stringify({ status: target })
    });
    toast(target==='approuve' ? 'Approuvé ✓' : target ? 'Pas de commande' : 'Statut retiré');
  }catch(e){
    // Échec → on remet l'état précédent
    acts.forEach(a=>a.classList.remove('on'));
    if(already) btn.classList.add('on');
    if(card){
      card.classList.remove('is-approuve','is-pas_de_commande');
      if(already) card.classList.add('is-'+status);
    }
    toast('Échec : '+e.message);
  }
}

/* ── Menu / Token ── */
function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('sheet-bg').classList.add('show'); }
function closeSheet(){ document.getElementById('sheet-bg').classList.remove('show'); }

function openMenu(){
  const list = loadAccounts();
  const comptes = list.map((a,i)=>{
    const actif = a.u === uname;
    return `<div class="menu-item acct-row" style="${actif?'background:#eff6ff':''}" onclick="switchAccount(${i})">
      <span class="ic">${actif?'✅':'👤'}</span>
      <div style="flex:1;min-width:0">
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.u)}${actif?' <span style="font-size:11px;color:var(--brand)">(actif)</span>':''}</div>
      </div>
      <span class="rm" onclick="event.stopPropagation();removeAccount(${i})">✕</span>
    </div>`;
  }).join('');
  openSheet(`
    <h3>Menu</h3>
    <div class="sub">Connecté : <b>${esc(uname)}</b> (${esc(role)})</div>
    <div class="sub" style="margin:0 0 4px">Mes comptes${list.length>1?' — touche pour basculer':''}</div>
    ${comptes}
    <div class="menu-item" onclick="addAccount()"><span class="ic">➕</span><div><div>Ajouter un compte</div><div style="font-size:12px;color:var(--muted)">Se connecter à un autre compte</div></div></div>
    <div class="menu-item" onclick="showToken()"><span class="ic">🔑</span><div><div>Token super-bot</div><div style="font-size:12px;color:var(--muted)">Jeton du compte ${esc(uname)}</div></div></div>
    <div class="menu-item" onclick="refresh();closeSheet()"><span class="ic">⟳</span>Rafraîchir</div>
    <div class="menu-item danger" onclick="logout()"><span class="ic">⎋</span>Se déconnecter${list.length>1?' de ce compte':''}</div>
  `);
}

function showToken(){
  openSheet(`
    <h3>🔑 Token super-bot</h3>
    <div class="sub">Jeton du compte <b>${esc(uname)}</b>. Colle-le dans la configuration du super-bot (champ « YapsonPress token »). Valable 30 jours.</div>
    <div class="tokenbox" id="tokbox">${esc(token)}</div>
    <div class="row">
      <button class="btn small" onclick="copyToken()">📋 Copier</button>
      <button class="btn small ghost" onclick="closeSheet()">Fermer</button>
    </div>
  `);
}
async function copyToken(){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(token); }
    else if(window.AndroidBridge){ window.AndroidBridge.copy(token); }
    else{ const r=document.createRange(); r.selectNode(document.getElementById('tokbox')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); s.removeAllRanges(); }
    toast('Token copié ✓');
  }catch(e){
    if(window.AndroidBridge){ try{ window.AndroidBridge.copy(token); toast('Token copié ✓'); return;}catch(_){} }
    toast('Copie impossible — sélectionne le texte');
  }
}
